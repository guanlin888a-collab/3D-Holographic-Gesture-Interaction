<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3D 实时手势全息画板</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      overflow: hidden;
      background: #000;
      font-family: 'Segoe UI', 'PingFang SC', sans-serif;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    main {
      position: relative;
      width: 100vw;
      height: 100vh;
    }
    #canvas-container {
      position: absolute; inset: 0; z-index: 1; pointer-events: none;
    }
    #camera-preview {
      position: absolute; top: 0; left: 0;
      width: 100%; height: 100%;
      object-fit: cover; z-index: 0;
      transform: scaleX(-1);
      pointer-events: none;
    }
    #status-bar {
      position: absolute; top: 16px; left: 50%; transform: translateX(-50%);
      z-index: 20;
      background: rgba(0,0,0,0.7);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 20px; padding: 5px 16px;
      color: #ccc; font-size: 12px; letter-spacing: 1px;
      backdrop-filter: blur(10px); pointer-events: none;
      white-space: nowrap;
    }
    #loading-overlay {
      position: absolute; inset: 0; z-index: 100;
      background: #000;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      transition: opacity 0.5s ease;
    }
    #loading-overlay.hidden { opacity: 0; pointer-events: none; }
    #loading-spinner {
      width: 40px; height: 40px;
      border: 2px solid rgba(255,255,255,0.15); border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 16px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    #loading-text { color: #aaa; font-size: 12px; letter-spacing: 2px; }
  </style>
</head>
<body>

  <div id="loading-overlay" role="status" aria-label="加载中">
    <div id="loading-spinner"></div>
    <div id="loading-text">INITIALIZING</div>
  </div>

  <main role="application" aria-label="3D 全息画板">
    <div id="status-bar" role="status" aria-live="polite">● 系统就绪 | 等待手势输入</div>
    <div id="canvas-container"></div>
    <video id="camera-preview" autoplay playsinline muted></video>
  </main>

  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
      }
    }
  </script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils@0.3/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4/hands.js" crossorigin="anonymous"></script>
  <script type="module" src="./main.js"></script>
</body>
</html>
